<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f3864">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="童鞋辦公室">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>童鞋貿易辦公室系統</title>
<style>
:root{--navy:#1f3864;--sub:#d9e1f2;--inp:#fff9d9;--line:#c8ccd4;--muted:#6b7280;--bg:#f4f6fa;--ok:#2e7d32;--warn:#c00000}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;font-size:14px;color:#111;background:var(--bg)}
#app{display:flex;min-height:100vh}
nav{width:200px;background:var(--navy);color:#fff;flex-shrink:0;padding:12px 0;position:sticky;top:0;height:100vh;overflow:auto}
nav h1{font-size:15px;margin:0 16px 12px;line-height:1.3}
nav .grp{font-size:11px;color:#9fb0d0;margin:14px 16px 4px;letter-spacing:.05em}
nav a{display:block;color:#fff;text-decoration:none;padding:7px 16px;font-size:14px;cursor:pointer}
nav a:hover{background:rgba(255,255,255,.1)}
nav a.on{background:#fff;color:var(--navy);font-weight:bold}
main{flex:1;padding:20px 24px;min-width:0}
h2{margin:0 0 14px;font-size:20px;color:var(--navy)}
h3{margin:18px 0 8px;font-size:15px;color:var(--navy)}
button{font:inherit;border:1px solid var(--navy);background:#fff;color:var(--navy);padding:6px 12px;border-radius:4px;cursor:pointer}
button.pri{background:var(--navy);color:#fff}
button.del{border-color:var(--warn);color:var(--warn)}
button.sm{padding:2px 8px;font-size:12px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.bar .sp{flex:1}
input,select,textarea{font:inherit;border:1px solid var(--line);border-radius:3px;padding:4px 6px;background:var(--inp);color:#0000c8;width:100%}
input[readonly]{background:#f1f1f1;color:#111}
textarea{min-height:60px}
table.list{border-collapse:collapse;width:100%;background:#fff}
table.list th{background:var(--navy);color:#fff;font-weight:normal;padding:6px;text-align:left;font-size:13px;white-space:nowrap}
table.list td{border-bottom:1px solid #e5e7eb;padding:6px;font-size:13px;vertical-align:middle}
table.list tr:hover td{background:#f7f9fc}
table.grid{border-collapse:collapse;background:#fff}
table.grid th{background:var(--navy);color:#fff;font-weight:normal;padding:4px;font-size:12px;white-space:nowrap}
table.grid td{border:1px solid var(--line);padding:2px;font-size:13px}
table.grid td.c{text-align:center;background:#fff;min-width:60px;padding:2px 6px}
table.grid input{border:none;padding:3px;min-width:40px}
table.grid input.sz{width:42px;min-width:42px;text-align:center}
table.grid tr.tot td{background:#ededed;font-weight:bold}
.card{background:#fff;border:1px solid #e3e6ec;border-radius:6px;padding:14px 16px;margin-bottom:14px}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px 14px}
.form label{font-size:12px;color:var(--muted);display:block;margin-bottom:2px}
.form .wide{grid-column:1/-1}
.scroll{overflow-x:auto}
.badge{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;background:#e8eefb;color:var(--navy)}
.muted{color:var(--muted);font-size:12px}
.warn{color:var(--warn);font-weight:bold}
.kpis{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.kpi{background:#fff;border:1px solid #e3e6ec;border-radius:6px;padding:10px 14px;min-width:150px}
.kpi b{display:block;font-size:20px;color:var(--navy)}
.imgbox{border:1px dashed #999;min-height:80px;display:flex;flex-wrap:wrap;gap:8px;padding:8px;align-items:flex-start;background:#fafafa}
.imgbox img{max-height:160px;max-width:240px;border:1px solid #ddd}
.thumb{max-height:50px;max-width:70px;display:block}
.toast{position:fixed;bottom:20px;right:20px;background:#333;color:#fff;padding:10px 16px;border-radius:6px;opacity:0;transition:.3s;pointer-events:none}
.toast.show{opacity:1}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:9}
#modal .box{background:#fff;border-radius:8px;padding:20px;max-width:420px;width:90%}
/* ---------- print document ---------- */
#printArea{display:none}
.doc{background:#fff;width:210mm;min-height:297mm;padding:12mm 12mm;margin:0 auto;font-size:11px;color:#000;font-family:Arial,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
.doc.land{width:297mm;min-height:210mm}
.doc .lh{text-align:center;border-bottom:2px solid var(--navy);padding-bottom:6px;margin-bottom:10px}
.doc .lh .n{font-size:20px;font-weight:bold}
.doc .lh .a{font-size:10px;margin-top:2px}
.doc .title{text-align:center;font-size:17px;font-weight:bold;margin:10px 0 12px;letter-spacing:.05em}
.doc .two{display:flex;justify-content:space-between;gap:20px;margin-bottom:12px}
.doc .two>div{flex:1}
.doc table.kv td{padding:2px 4px;vertical-align:top}
.doc table.kv td:first-child{font-weight:bold;white-space:nowrap;text-align:right}
.doc table.kv.l td:first-child{text-align:left}
.doc table.t{width:100%;border-collapse:collapse;margin-bottom:8px}
.doc table.t th{background:var(--navy);color:#fff;border:1px solid #555;padding:4px 3px;font-size:10px}
.doc table.t td{border:1px solid #777;padding:3px;font-size:10.5px}
.doc table.t td.c{text-align:center}.doc table.t td.r{text-align:right}
.doc table.t tr.tot td{background:#ededed;font-weight:bold}
.doc .sec{font-weight:bold;font-size:12px;margin:12px 0 4px}
.doc .sign{display:flex;justify-content:space-between;margin-top:36px}
.doc .sign>div{width:42%}
.doc .sign .ln{border-top:1px solid #000;margin-top:44px;padding-top:3px;font-size:9px}
.doc .box{border:1px solid #777;padding:6px;white-space:pre-wrap;min-height:40px}
.doc .pic{border:1px solid #777;min-height:70mm;display:flex;flex-wrap:wrap;gap:6px;padding:6px;align-items:center;justify-content:center}
.doc .pic img{max-height:68mm;max-width:90mm}
.doc td img{max-height:22mm;max-width:30mm;display:block;margin:auto}
@media print{
  @page{size:A4;margin:0}
  body{background:#fff}
  #app,.toast,#modal{display:none!important}
  #printArea{display:block!important}
  .doc{margin:0;width:auto;min-height:0}
  body.land-print .doc{width:auto}
}
@media screen{ body.preview #app{display:none} body.preview #printArea{display:block;padding:60px 0 30px} }
#pvbar{display:none;position:fixed;top:0;left:0;right:0;background:var(--navy);padding:10px;gap:8px;justify-content:center;z-index:5}
body.preview #pvbar{display:flex}
@media print{#pvbar{display:none!important}}


a{color:#1f3864}
.btn{display:inline-block;font:inherit;border:1px solid var(--navy);background:#fff;color:var(--navy);padding:6px 12px;border-radius:4px;cursor:pointer;text-decoration:none}
.card h3{margin-top:0}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.scard{display:flex;gap:10px;background:#fff;border:1px solid #e3e6ec;border-radius:6px;padding:10px;text-decoration:none;color:#111}
.scard:hover{border-color:var(--navy)}
.simg{width:90px;height:90px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:#f4f4f4;border-radius:4px;overflow:hidden;color:#999;font-size:12px}
.simg img{max-width:100%;max-height:100%}
.sbody{font-size:13px;line-height:1.5;min-width:0}
.imgbox .im{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.addimg{align-self:center;border:1px dashed var(--navy);color:var(--navy);padding:20px 16px;border-radius:6px;cursor:pointer;background:#fff}
.noimg{display:flex;align-items:center;justify-content:center;background:#f2f2f2;color:#aaa;font-size:10px;border:1px solid #e5e5e5}
.stg{display:flex;gap:2px;margin-bottom:2px}.stg i{display:block;width:16px;height:8px;border-radius:2px;background:#dde1e8}.stg i.d{background:#2e7d32}.stg i.l{background:#c00000}
tr.late td{background:#fff1f1!important}
.badge.grey{background:#eee;color:#555}.badge.ok{background:#e3f4e4;color:#2e7d32}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:16px}
.fstep{background:#fff;border:1px solid #cfd6e4;border-radius:6px;padding:8px 10px;text-decoration:none;color:#111;width:150px}
.fstep b{display:block;color:var(--navy)}.fstep span{font-size:11px;color:var(--muted)}.fstep:hover{border-color:var(--navy)}
.arr{color:#9aa}
a.kpi{text-decoration:none;color:#111}
.warnbox{border-color:#f0b4b4;background:#fff5f5;color:#900}
.totline{margin-top:10px;padding:8px 10px;background:#f1f4fa;border-radius:4px}
.mgroup{border:1px solid #e3e6ec;border-radius:6px;padding:8px;margin-bottom:10px}
.mhead{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.plrow{border:1px solid #e3e6ec;border-radius:6px;padding:8px;margin-bottom:8px}
.plh{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:6px}
.plh input,.plh select{display:inline-block}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form .w2{grid-column:span 2}
table.list td .muted{font-size:11px}
.doc td.lb{background:#d9e1f2;font-weight:bold;width:20%}
.doc table.t{page-break-inside:auto}.doc table.t tr{page-break-inside:avoid}

#auth{position:fixed;inset:0;background:linear-gradient(135deg,#1f3864,#2f5597);display:none;align-items:flex-start;justify-content:center;z-index:20;overflow:auto;padding:40px 12px}
#auth .abox{background:#fff;border-radius:10px;padding:26px 28px;width:100%;max-width:440px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
#auth .alogo{font-weight:bold;color:var(--navy);font-size:16px;margin-bottom:12px}
#auth h2{margin:0 0 10px}
#auth label{display:block;font-size:13px;color:#444;margin:12px 0 4px}
#auth input{font-size:16px;padding:8px 10px;background:#fff;color:#111}
#auth #acode{letter-spacing:6px;font-size:22px;text-align:center}
#auth button.pri{width:100%;margin-top:16px;padding:10px;font-size:15px}
#auth button:disabled{opacity:.6}
.aerr{display:none;margin-top:10px;background:#fff1f1;color:#b00;border:1px solid #f3c0c0;border-radius:4px;padding:8px 10px;font-size:13px}
.alinks{display:flex;flex-direction:column;gap:8px;margin-top:16px;font-size:13px}
.alinks label{color:var(--navy);text-decoration:underline;cursor:pointer;margin:0;font-size:13px}
.amuted{color:#555;font-size:13px;line-height:1.6}
.steps{font-size:12px;color:#888;margin-bottom:10px}.steps b{color:var(--navy)}
.qr{text-align:center;margin:8px 0}.qr svg{width:200px;height:200px}
code.key{font-size:13px;background:#f1f4fa;padding:2px 6px;border-radius:3px;word-break:break-all;user-select:all}
.rc{font-family:Consolas,monospace;font-size:20px;letter-spacing:1px;text-align:center;background:#fff9d9;border:2px dashed #c9a400;border-radius:6px;padding:14px;margin:10px 0;user-select:all;word-break:break-all}
nav a.lockbtn{margin:0 16px 6px;border:1px solid rgba(255,255,255,.4);border-radius:4px;text-align:center;font-size:13px;padding:5px}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid #c8ccd4;border-radius:14px;padding:3px 10px;font-size:13px;cursor:pointer;background:#fff;user-select:none;margin:2px 0}
.chip:hover{border-color:var(--navy)}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.chip.sel{cursor:default;margin-right:4px}.chip.sel i{font-style:normal;cursor:pointer;opacity:.8;padding-left:2px}.chip.sel i:hover{opacity:1}

#topbar,#navShade{display:none}
@media screen and (max-width:800px){
  #app{display:block}
  #topbar{display:flex;position:fixed;top:0;left:0;right:0;z-index:20;background:var(--navy);color:#fff;align-items:center;gap:6px;padding:env(safe-area-inset-top) 8px 0;height:calc(50px + env(safe-area-inset-top))}
  #topbar button,#topbar a{background:none;border:none;color:#fff;font-size:22px;padding:6px 10px;text-decoration:none}
  #tbTitle{flex:1;font-weight:bold;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  nav{position:fixed;left:0;top:0;bottom:0;width:260px;height:100%;z-index:30;transform:translateX(-105%);transition:transform .2s;padding-top:calc(12px + env(safe-area-inset-top));padding-bottom:env(safe-area-inset-bottom)}
  body.navopen nav{transform:none}
  body.navopen #navShade{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:25}
  nav a{padding:10px 16px;font-size:15px}
  main{padding:calc(62px + env(safe-area-inset-top)) 12px calc(24px + env(safe-area-inset-bottom))}
  h2{font-size:18px}
  input,select,textarea{font-size:16px}
  .form{grid-template-columns:1fr 1fr;gap:8px 10px}.form .w2{grid-column:1/-1}
  .card{padding:12px}
  .bar button,.bar .btn{padding:8px 12px}
  button.sm{padding:5px 10px;font-size:13px}
  main table.list{display:block;overflow-x:auto;white-space:nowrap}
  .fstep{width:calc(50% - 20px)}.flow .arr{display:none}
  .kpi{flex:1 1 40%;min-width:0}
  .two-col{grid-template-columns:1fr}
  .mhead{flex-wrap:wrap}
  .plh{gap:8px}
  .scard{padding:8px}.simg{width:72px;height:72px}
  #pvbar{padding-top:calc(10px + env(safe-area-inset-top))}
  body.preview #printArea{padding:calc(64px + env(safe-area-inset-top)) 6px 30px;overflow-x:hidden}
  .toast{bottom:calc(20px + env(safe-area-inset-bottom));right:12px;left:12px;text-align:center}
  #auth{padding-top:calc(24px + env(safe-area-inset-top))}
}
@media screen and (max-width:480px){.form{grid-template-columns:1fr}.fstep{width:100%}}
@media print{.doc{zoom:1!important}}
#auth{z-index:40!important}
body.preview #topbar{display:none!important}

nav a.syncstat{display:block;margin:0 16px 8px;font-size:12px;color:#cfe0ff;padding:2px 0;text-decoration:none}
nav a.syncstat.bad{color:#ffb4b4}
#topbar a.syncstat{font-size:12px;padding:4px 6px;white-space:nowrap}
#topbar a.syncstat.bad{color:#ffb4b4}

nav .whoami{margin:0 16px 6px;font-size:12px;color:#cfe0ff}
.doc .nopr{text-align:center;color:#b00;font-weight:bold;border:1px dashed #b00;padding:3px;margin:-4px 0 8px;font-size:11px}

label.btn.sm{padding:4px 10px;font-size:13px}
.note{border:1px solid #e3e6ec;border-radius:6px;padding:8px;margin-bottom:10px;background:#fcfcfe}
.nhead{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.ncontact{display:flex;flex-wrap:wrap;gap:4px 16px;background:#eef3ff;border-radius:4px;padding:6px 8px;margin:6px 0;font-size:13px}
.nfiles{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.nf{position:relative}.nf img{height:90px;max-width:140px;object-fit:cover;border:1px solid #ddd;border-radius:4px;cursor:zoom-in;display:block}
.nf i{position:absolute;top:-6px;right:-6px;background:#b00;color:#fff;border-radius:50%;width:20px;height:20px;line-height:20px;text-align:center;font-style:normal;font-size:12px;cursor:pointer}
.nf.file{display:flex;gap:8px;align-items:center;border:1px solid #ddd;border-radius:4px;padding:6px 26px 6px 8px;background:#fff}
.card.sup{display:flex;gap:12px;align-items:flex-start}.supimg{display:flex;flex-direction:column;gap:4px;width:110px;flex-shrink:0}.supimg img{width:110px;border:1px solid #ddd;border-radius:4px;cursor:zoom-in}
.doc .notesp{margin-top:18px;page-break-before:auto}
.doc .nentry{margin:8px 0 12px;page-break-inside:avoid}
.doc .nmeta{font-size:10px;color:#444;margin-bottom:3px}
.doc .nimgs{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.doc .nimgs img{max-width:58mm;max-height:58mm;border:1px solid #999}
@media screen and (max-width:800px){.card.sup{flex-direction:column}.supimg{flex-direction:row;width:auto}.supimg img{width:80px}}

.doc.pdfmode{min-height:0!important;margin:0!important;box-shadow:none}
#pvbar button{white-space:nowrap}

.bar select{max-width:100%}

.chip.sel a{color:#fff}
</style>
</head>
<body>
<div id="pvbar"><button class="pri" id="pdfbtn" onclick="savePDF()">⬇ 存 PDF</button><button onclick="doPrint()">🖨 列印</button><button onclick="closePreview()">✕ 返回</button></div>
<div id="auth"></div>
<div id="topbar"><button onclick="toggleNav(true)" aria-label="選單">☰</button><span id="tbTitle">童鞋辦公室</span><a class="syncstat" href="#cloud" style="display:none"></a><a href="javascript:lockNow()" aria-label="鎖定">🔒</a></div>
<div id="navShade" onclick="toggleNav(false)"></div>
<div id="app" style="display:none"><nav id="nav"></nav><main id="main"></main></div>
<div id="printArea"></div>
<div id="modal"><div class="box" id="modalBox"></div></div>
<div class="toast" id="toast"></div>

/* =================== 基本工具 =================== */
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const today=()=>new Date().toISOString().slice(0,10);
const addDays=(d,n)=>{if(!d)return'';const x=new Date(d);if(isNaN(x))return'';x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseFloat(v);return isNaN(n)?0:n};
const f2=n=>num(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const f0=n=>num(n).toLocaleString('en-US',{maximumFractionDigits:0});
const f1=n=>num(n).toLocaleString('en-US',{minimumFractionDigits:1,maximumFractionDigits:1});
const f3=n=>num(n).toFixed(3);
const pct=(a,b)=>b?((a/b)*100).toFixed(1)+'%':'';
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2500)}
const pathKeys=p=>[...p.matchAll(/\[([^\]]*)\]|([^.\[\]]+)/g)].map(m=>m[1]??m[2]);
const getPath=(o,p)=>pathKeys(p).reduce((a,k)=>a==null?a:a[k],o);
function setPath(o,p,v){const ks=pathKeys(p);const last=ks.pop();const t=ks.reduce((a,k)=>a[k]??(a[k]={}),o);t[last]=v}

const cbmOf=s=>s.L&&s.W&&s.H?+(num(s.L)*num(s.W)*num(s.H)/1e6).toFixed(3):'';

 const m=/^(\d+(?:\.\d+)?)\s*[-~–至]\s*(\d+(?:\.\d+)?)$/.exec(r);
 if(m){const dec=m[1].includes('.')||m[2].includes('.');const half=/\.5$/.test(m[1])||/\.5$/.test(m[2]);const step=half?0.5:1;const a=+m[1],b=+m[2],out=[];

 return r.split(/[,/、\s]+/).filter(Boolean)}

function coTotals(co){let qty=0,amt=0,cost=0;co.lines.forEach(l=>{const q=qtyTot(l.qty);qty+=q;amt+=q*num(l.price);cost+=q*num(findStyle(l.devNo).factoryPrice)});return{qty,amt,cost}}
function poTotals(po){const qty=po.lines.reduce((a,l)=>a+qtyTot(l.qty),0);return{qty,amt:qty*num(po.cost)}}
const ctns=l=>l.from!==''&&l.to!==''&&l.from!=null&&l.to!=null?Math.max(0,num(l.to)-num(l.from)+1):0;
function plTotals(pl){const t={ctn:0,prs:0,nw:0,gw:0,cbm:0};pl.lines.forEach(l=>{const c=ctns(l);t.ctn+=c;t.prs+=qtyTot(l.qty)*c;t.nw+=num(l.nw)*c;t.gw+=num(l.gw)*c;t.cbm+=num(l.cbm)*c});return t}
function invTotals(inv){let qty=0,amt=0;inv.lines.forEach(l=>{qty+=num(l.qty);amt+=num(l.qty)*num(l.price)});return{qty,amt}}
const paid=co=>(co.payments||[]).reduce((a,p)=>a+num(p.amount),0);
const deposits=co=>(co.payments||[]).filter(p=>p.type==='訂金').reduce((a,p)=>a+num(p.amount),0);
const docsOf=(type,f)=>S.docs.filter(d=>d.type===type&&(!f||f(d)));
function packedBy(coId){const m={};docsOf('PL',d=>d.coId===coId).forEach(pl=>pl.lines.forEach(l=>{const k=l.devNo+'|'+l.color;m[k]=(m[k]||0)+qtyTot(l.qty)*ctns(l)}));return m}

 <div class="bar" style="margin-top:10px">自己打碼數 <input id="sz_custom" style="max-width:320px" placeholder="例如 13.5 或 14.0-16.0 或 2C, 3C" onkeydown="if(event.key==='Enter')addCustomSize('${id}')"><button onclick="addCustomSize('${id}')">加入</button></div>
 <div style="margin-top:8px"><b>已揀 ${cur.length} 個碼：</b>${cur.length?cur.map(z=>`<span class="chip on sel">${esc(z)}<i onclick="toggleSize('${id}',this.parentNode.dataset.z)">✕</i></span>`.replace('class="chip on sel"',`class="chip on sel" data-z="${esc(z)}"`)).join(''):'<span class="warn">未揀碼段</span>'} ${cur.length?`<button class="sm del" onclick="setSizes('${id}',[])">全部清除</button>`:''}</div></div>`}
function setSizes(id,arr){const s=S.styles.find(x=>x.id===id);s.sizes=sortSizes(arr.map(z=>String(z).trim()).filter(Boolean));s.sizeRange=sizeSummary(s.sizes);save();render()}
function toggleSize(id,z){const s=S.styles.find(x=>x.id===id);const cur=[...styleSizes(s)];const i=cur.indexOf(z);if(i>=0)cur.splice(i,1);else cur.push(z);setSizes(id,cur)}
function applySizeRange(id,sys){const Y=SIZE_SYS[sys];let a=+document.getElementById('sz_from').value,b=+document.getElementById('sz_to').value,st=+document.getElementById('sz_step').value;if(a>b)[a,b]=[b,a];
 const out=[];for(let x=a;x<=b+1e-9;x+=st)out.push(Y.fmt(x));const s=S.styles.find(x=>x.id===id);setSizes(id,[...styleSizes(s),...out]);toast(`已加入 ${out[0]} 至 ${out[out.length-1]}`)}
function addCustomSize(id){const v=document.getElementById('sz_custom').value.trim();if(!v)return;const add=v.split(/[,，、;]+/).flatMap(x=>parseRange(x.trim()));const s=S.styles.find(x=>x.id===id);setSizes(id,[...styleSizes(s),...add]);toast('已加入 '+add.join(', '))}
function delStyle(id){const s=S.styles.find(x=>x.id===id);ask(`確定刪除款式 ${esc(s.devNo)}？（相關單據唔會刪除）`,()=>{S.styles=S.styles.filter(x=>x.id!==id);save();go('STY')})}

function docSummary(d){
 if(d.type==='SD')return [esc(d.devNo),esc(findFac(d.fac).name||''),esc(d.stype),stageBar(d.stages),badge(d.status)];
 if(d.type==='QT')return [esc(findCust(d.cust).name||''),d.lines.map(l=>esc(l.devNo)).join(', '),badge(d.status)];
 if(d.type==='CO'){const t=coTotals(d);return [esc(findCust(d.cust).name||''),`<b>${esc(d.custPO)}</b>`,f0(t.qty)+' 雙',CANP()?curOf(d)+' '+f2(t.amt):'🔒',esc(d.etd),badge(d.status)]}
 if(d.type==='PO'){const t=poTotals(d);return [esc(d.devNo),esc(findFac(d.fac).name||''),esc(d.custPO),f0(t.qty)+' 雙',esc(d.delivery),stageBar(d.stages)]}
 if(d.type==='PL'){const t=plTotals(d);return [esc(findCust(d.cust).name||''),esc(d.custPO),t.ctn+' 箱',f0(t.prs)+' 雙']}
 if(d.type==='INV'){const t=invTotals(d);return [esc(findCust(d.cust).name||''),esc(d.custPO),f0(t.qty)+' 雙',CANP()?curOf(d)+' '+f2(t.amt):'🔒']}
 if(d.type==='PI'){const t=coTotals(d);return [esc(findCust(d.cust).name||''),esc(d.custPO),f0(t.qty)+' 雙',CANP()?curOf(d)+' '+f2(t.amt):'🔒']}
 if(d.type==='CR')return [esc(d.courier),trackLink(d),esc(d.recv?.company||''),esc(d.contents)+((d.sdIds||[]).length?' · '+d.sdIds.map(id=>esc(docById(id)?.devNo||'')).join(', '):''),badge(d.status,d.status==='已簽收'?'ok':'')]}
const HEADS={SD:['款號','工廠','類型','進度','狀態'],QT:['客戶','款號','狀態'],CO:['客戶','客人PO號','雙數','金額','ETD','狀態'],PO:['款號','工廠','客人PO號','雙數','交貨期','生產進度'],PL:['客戶','客人PO號','箱數','雙數'],INV:['客戶','客人PO號','雙數','金額'],PI:['客戶','客人PO號','雙數','金額'],CR:['快遞','運單號（㩒追蹤）','收件','內容','狀態']};
const INTRO={CR:'每次寄快遞記低：快遞公司、運單號、寄俾邊個、寄咗咩。㩒運單號可以直接追蹤；「列印」會印出報關用嘅 Proforma / Commercial Invoice。喺樣板單㩒「📦 寄快遞」會自動帶入資料。',SD:'揀開發款式開樣板單俾工廠，圖片同資料會自動帶入。每張樣板單都有自己嘅進度追蹤。',QT:'樣板完成之後，開報價單俾客人。可以喺開發款式或者樣板單入面一㩒開。',CO:'客人確認報價之後會落 PO 俾你，喺呢度輸入每個顏色、每個碼嘅數量。之後一㩒就可以生成採購單（每款一張）。',PO:'採購單由客人訂單生成，每款一張，用工廠價。每張都有生產進度追蹤。',PL:'生產完成後，由客人訂單開 Packing List。',INV:'由 Packing List 一㩒開 Invoice，向客人收款。',PI:'（可選）有啲客人要 PI 先肯落訂金，可以由客人訂單開。'};
function docList(type){const docs=docsOf(type).sort((a,b)=>(b.date||'').localeCompare(a.date||'')||b.created-a.created);
 const canNew={SD:1,QT:1,CO:1,CR:1}[type];
 return `<h2>${NAV.find(n=>n[0]===type)[1]}</h2><p class="muted">${INTRO[type]}</p><div class="bar">${canNew?`<button class="pri" onclick="flowNew('${type}')">＋ 新增${T[type].name}</button>`:''}<span class="sp"></span><input placeholder="搜尋…" style="max-width:240px" oninput="filterRows(this.value)"></div>${type==='CR'?crLogExtra():''}
 ${docs.length?`<div class="scroll"><table class="list" id="lt"><tr><th>單號</th><th>日期</th>${HEADS[type].map(h=>`<th>${h}</th>`).join('')}<th></th></tr>
 ${docs.map(d=>`<tr><td><a href="#${type}-${d.id}"><b>${esc(d.no)}</b></a></td><td>${esc(d.date)}</td>${docSummary(d).map(x=>`<td>${x}</td>`).join('')}
 <td style="white-space:nowrap;text-align:right"><button class="sm" onclick="preview('${d.id}')">列印</button> <button class="sm" onclick="dupDoc('${d.id}')">複製</button> <button class="sm del" onclick="delDoc('${d.id}')">刪除</button></td></tr>`).join('')}</table></div>`:`<div class="card muted">未有${T[type].name}。</div>`}`}
function filterRows(q){q=q.toLowerCase();document.querySelectorAll('#lt tr:not(:first-child)').forEach(r=>r.style.display=r.textContent.toLowerCase().includes(q)?'':'none')}
function flowNew(type,extra){const d=newDoc(type,extra||{});if(type==='QT'&&extra&&extra.devNo){}S.docs.push(d);save();go(type,d.id)}
function dupDoc(id){const o=docById(id);const d=JSON.parse(JSON.stringify(o));d.id=uid();d.no=nextNo(T[o.type].prefix);d.date=today();d.created=Date.now();if(d.stages)d.stages.forEach(s=>{s.actual='';s.plan=''});if(d.payments)d.payments=[];S.docs.push(d);save();toast('已複製做 '+d.no);go(o.type,d.id)}
function delDoc(id){const d=docById(id);ask(`確定刪除 ${esc(d.no)}？刪除後無法復原。`,()=>{S.docs=S.docs.filter(x=>x.id!==id);save();go(d.type)})}

function qtFromStyle(sid){const s=S.styles.find(x=>x.id===sid);const d=newDoc('QT',{cust:s.cust||S.customers[0]?.code||''});d.lines=[{devNo:s.devNo,colors:s.colors,moq:'',price:s.sellPrice??'',rem:''}];S.docs.push(d);save();toast('已開報價單 '+d.no);go('QT',d.id)}
function qtFromSD(id){const sd=docById(id);const s=findStyle(sd.devNo);if(sd.reply.bulk&&!s.factoryPrice)s.factoryPrice=num(sd.reply.bulk);const d=newDoc('QT',{cust:sd.cust});d.lines=[{devNo:sd.devNo,colors:sd.colors||s.colors,moq:sd.reply.moq||'',price:s.sellPrice??'',rem:''}];S.docs.push(d);save();toast('已開報價單 '+d.no);go('QT',d.id)}
function replyToStyle(id){const sd=docById(id);const s=findStyle(sd.devNo);if(!s.devNo)return toast('搵唔到款式');if(sd.reply.bulk!=='')s.factoryPrice=num(sd.reply.bulk);if(sd.reply.cost!=='')s.sampleCost=sd.reply.cost;save();toast(`已將工廠價 ${sd.reply.bulk||'-'} 記入 ${s.devNo}`)}
function coFromQT(id){const q=docById(id);const d=newDoc('CO',{cust:q.cust,qtId:q.id,payment:findCust(q.cust).payment||''});
 q.lines.forEach(l=>{const cols=String(l.colors||'').split(/[,/、]+/).map(x=>x.trim()).filter(Boolean);(cols.length?cols:['']).forEach(c=>d.lines.push({devNo:l.devNo,color:c,qty:{},price:l.price}))});
 q.status='客人已確認';S.docs.push(d);save();toast('已開客人訂單 '+d.no+'，請輸入客人 PO 號同數量');go('CO',d.id)}
function genPOs(id){const co=docById(id);const styles=[...new Set(co.lines.map(l=>l.devNo).filter(Boolean))];let made=[],skip=[];
 styles.forEach(dn=>{if(docsOf('PO',p=>p.coId===co.id&&p.devNo===dn).length){skip.push(dn);return}const s=findStyle(dn);
  const p=newDoc('PO',{fac:s.factory||'',coId:co.id,devNo:dn,custPO:co.custPO,delivery:co.etd,cost:s.factoryPrice??''});
  p.lines=co.lines.filter(l=>l.devNo===dn).map(l=>({color:l.color,qty:{...l.qty}}));p.req.pack=`每對入彩盒，每箱 ${s.prsCtn||12} 對`;S.docs.push(p);made.push(p.no)});
 save();render();toast(made.length?`已生成 ${made.length} 張採購單：${made.join('、')}`:'')
 if(skip.length)setTimeout(()=>toast(`${skip.join('、')} 已經有採購單，冇重複生成`),made.length?2600:0)}
function plFromCO(id,onlyDev){const co=docById(id);const d=newDoc('PL',{cust:co.cust,coId:co.id,custPO:co.custPO});d.to=findCust(co.cust).dest||'';let c=1;
 const packed=packedBy(co.id);
 co.lines.filter(l=>l.devNo&&(!onlyDev||l.devNo===onlyDev)).forEach(l=>{const s=findStyle(l.devNo);const total=qtyTot(l.qty)-(packed[l.devNo+'|'+l.color]||0);if(total<=0)return;const per=num(s.prsCtn)||12;const k=Math.ceil(total/per);
  d.lines.push({from:c,to:c+k-1,devNo:l.devNo,color:l.color,qty:{},nw:s.nw??'',gw:s.gw??'',cbm:cbmOf(s)});c+=k});
 if(!d.lines.length)return toast('呢張訂單已經全部入咗 Packing List');
 S.docs.push(d);save();toast('已開 Packing List '+d.no+'，請填每箱每碼雙數');go('PL',d.id)}
function invFromPL(id){const pl=docById(id);const ex=docsOf('INV',x=>x.plId===pl.id)[0];if(ex){toast('呢張 Packing List 已經有 Invoice');return go('INV',ex.id)}
 const co=docById(pl.coId);const d=newDoc('INV',{no:pl.no,date:pl.date,cust:pl.cust,coId:pl.coId,plId:pl.id,custPO:pl.custPO,from:pl.from,to:pl.to,vessel:pl.vessel});
 const m={};pl.lines.forEach(l=>{if(!l.devNo)return;const k=l.devNo+'|'+l.color;const cl=co?.lines.find(x=>x.devNo===l.devNo&&x.color===l.color)||co?.lines.find(x=>x.devNo===l.devNo);m[k]=m[k]||{devNo:l.devNo,color:l.color,qty:0,price:cl?cl.price:(findStyle(l.devNo).sellPrice??'')};m[k].qty+=qtyTot(l.qty)*ctns(l)});
 d.lines=Object.values(m);d.lessDeposit=!!(co&&deposits(co));S.docs.push(d);save();toast('已開 Invoice '+d.no);go('INV',d.id)}
function piFromCO(id){const co=docById(id);const d=newDoc('PI',{cust:co.cust,coId:co.id,custPO:co.custPO,etd:co.etd});d.lines=JSON.parse(JSON.stringify(co.lines));S.docs.push(d);save();go('PI',d.id)}

 ${getPath(S,P).map((s,k)=>`<tr class="${!s.actual&&s.plan&&s.plan<today()?'late':''}"><td>${inp(`${P}.${k}.name`,{w:130,st:'background:#fff;color:#000;font-weight:bold'})}</td><td>${inp(`${P}.${k}.plan`,{type:'date',r:1})}</td><td>${inp(`${P}.${k}.actual`,{type:'date',r:1})}</td><td>${inp(`${P}.${k}.note`,{w:220})}</td><td><button class="sm del" onclick="getPath(S,'${P}').splice(${k},1);save();render()">✕</button></td></tr>`).join('')}</table></div>
 <div class="bar" style="margin:8px 0 0"><button class="sm" onclick="getPath(S,'${P}').push({name:'',plan:'',actual:'',note:''});save();render()">＋ 加階段</button><button class="sm" onclick="todayNext('${P}')">✓ 下一個階段今日完成</button></div></div>`}
function todayNext(P){const n=getPath(S,P).find(s=>!s.actual);if(n){n.actual=today();save();render();toast(n.name+' 已完成')}}
// 顏色 × 碼數 矩陣（按款分組）
function matrixEditor(P,lines,opt){// opt:{group:true(多款), price:'line'|'none', priceLabel}
 const groups=[...new Set(lines.map(l=>l.devNo||opt.devNo||''))];let h='';
 groups.forEach(dn=>{const sizes=sizesOf(dn);const idxs=lines.map((l,i)=>[l,i]).filter(([l])=>(l.devNo||opt.devNo||'')===dn);const s=findStyle(dn);
  h+=`<div class="mgroup">${opt.group?`<div class="mhead">${thumb(imgOf(dn),40)}<div><b>${esc(dn)}</b> ${esc(s.name||'')} ${s.custStyle?`<span class="muted">客款 ${esc(s.custStyle)}</span>`:''}<div class="muted">碼段 ${esc(s.sizeRange||'')}</div></div><span class="sp"></span><button class="sm" onclick="addColorRow('${P}','${esc(dn)}')">＋ 加顏色</button><button class="sm del" onclick="rmStyleRows('${P}','${esc(dn)}')">刪除呢款</button></div>`:''}
  <div class="scroll"><table class="grid"><tr><th>顏色</th>${sizes.map(z=>`<th>${esc(z)}</th>`).join('')}<th>合計</th>${opt.price==='line'?`<th>${opt.priceLabel||'單價'}</th><th>金額</th>`:''}<th></th></tr>

  <tr class="tot"><td>小計</td>${sizes.map(z=>`<td class="c">${calc(`gz${dn}${z}`,()=>{const v=getPath(S,P).filter(l=>(l.devNo||opt.devNo||'')===dn).reduce((a,l)=>a+num(l.qty?.[z]),0);return v?f0(v):''})}</td>`).join('')}<td class="c">${calc(`gt${dn}`,()=>f0(getPath(S,P).filter(l=>(l.devNo||opt.devNo||'')===dn).reduce((a,l)=>a+qtyTot(l.qty),0)))}</td>${opt.price==='line'?'<td></td><td></td>':''}<td></td></tr></table></div>
  <datalist id="cl-${esc(dn)}">${colorsOf(dn).map(c=>`<option value="${esc(c)}">`).join('')}</datalist></div>`});
 return h}
function addColorRow(P,dn){const arr=getPath(S,P);const used=arr.filter(l=>l.devNo===dn).map(l=>l.color);const c=colorsOf(dn).find(x=>!used.includes(x))||'';const base=arr.find(l=>l.devNo===dn);arr.push({devNo:dn,color:c,qty:{},price:base?.price??findStyle(dn).sellPrice??''});save();render()}

function download(name,text,type){const ios=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
 if(ios&&navigator.canShare){try{const f=new File([text],name,{type});if(navigator.canShare({files:[f]})){navigator.share({files:[f]}).catch(()=>{});return}}catch(e){}}
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove()}
async function exportJSON(){S.lastBackup=today();await flush();toast('準備備份（連相片 / 檔案）…');const{atts,miss}=await backupAtts();download(`辦公室系統備份-加密-${today()}.json`,JSON.stringify({vault:VAULT,atts}),'application/json');if(miss)toast(`⚠ 有 ${miss} 個檔案喺其他機未同步到，冇包括喺備份`);render()}
function importJSON(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{let x;try{x=JSON.parse(r.result)}catch(e){return toast('檔案格式唔啱')}
 if(!CANP())return toast('只有負責人可以還原備份');
 const bk=unwrapBackup(x);if(isVault(bk.vault))ask('還原會取代而家所有資料。還原之後要用<b>建立備份嗰陣嘅密碼</b>登入。確定？',async()=>{await flush();x=bk.vault;GK=null;PK=null;S=null;VAULT=x;await idbPut('vault',x);await restoreAtts(bk.atts);for(const k of['ncstate','ncbase'])await idbDel(k);loginView('已還原備份。請用備份嘅密碼登入。')});
 else if(x.company&&Array.isArray(x.docs)&&Array.isArray(x.styles))ask(`匯入舊版（未加密）備份，會取代而家所有資料（備份有 ${x.styles.length} 個款式、${x.docs.length} 張單）。確定？`,()=>{S={...x,auth:S.auth,settings:{...S.settings,...(x.settings||{}),lockMin:S.settings.lockMin}};save();toast('已匯入');go('home')});
 else toast('檔案格式唔啱')};r.readAsText(f)}

/* =================== 加密儲存 + 登入（負責人：密碼 + 手機驗證碼；同事：名 + 密碼） ===================
 資料分兩份加密：
   gdata（一般資料）用 GK 加密 —— 負責人同同事都有 GK
   pdata（價錢資料 + 負責人驗證碼）用 PK 加密 —— 只有負責人有 PK
 VAULT v2 = {v:2, users:[{id,name,role:'owner'|'staff',w}], rc, gk, gdata, pdata, label, created, rev}
   owner.w = 用密碼包住 PK；staff.w = 用密碼包住 GK；rc = 用恢復碼包住 PK；gk = 用 PK 加密嘅 GK
*/
const DBNAME='shoe-office-v2',STORE='kv';
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open(DBNAME,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function idbGet(k){const db=await idb();return new Promise(res=>{const q=db.transaction(STORE).objectStore(STORE).get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>res(null)})}
async function idbPut(k,v){const db=await idb();return new Promise((res,rej)=>{const t=db.transaction(STORE,'readwrite');t.objectStore(STORE).put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error)})}
async function idbDel(k){const db=await idb();return new Promise(res=>{const t=db.transaction(STORE,'readwrite');t.objectStore(STORE).delete(k);t.oncomplete=res;t.onerror=res})}

const te=new TextEncoder(),td=new TextDecoder();
const rand=n=>crypto.getRandomValues(new Uint8Array(n));
function b64(buf){const u=new Uint8Array(buf);let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)}
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const ITER=600000;
async function kek(secret,salt,iter){const base=await crypto.subtle.importKey('raw',te.encode(secret),'PBKDF2',false,['deriveKey']);
 return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['wrapKey','unwrapKey'])}
async function wrapWith(secret,dk){const salt=rand(16),iv=rand(12);const k=await kek(secret,salt,ITER);const wk=await crypto.subtle.wrapKey('raw',dk,k,{name:'AES-GCM',iv});return{salt:b64(salt),iv:b64(iv),wk:b64(wk),iter:ITER}}
async function unwrapWith(secret,w){const k=await kek(secret,unb64(w.salt),w.iter||ITER);return crypto.subtle.unwrapKey('raw',unb64(w.wk),k,{name:'AES-GCM',iv:unb64(w.iv)},{name:'AES-GCM'},true,['encrypt','decrypt'])}
async function encData(dk,obj){const iv=rand(12);const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},dk,te.encode(JSON.stringify(obj)));return{iv:b64(iv),ct:b64(ct)}}
async function decData(dk,d){const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(d.iv)},dk,unb64(d.ct));return JSON.parse(td.decode(pt))}
const newKey=()=>crypto.subtle.generateKey({name:'AES-GCM',length:256},true,['encrypt','decrypt']);
async function keyRaw(k){return b64(await crypto.subtle.exportKey('raw',k))}
async function encKey(pk,k){const iv=rand(12);const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},pk,await crypto.subtle.exportKey('raw',k));return{iv:b64(iv),ct:b64(ct)}}
async function decKey(pk,d){const raw=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(d.iv)},pk,unb64(d.ct));return crypto.subtle.importKey('raw',raw,{name:'AES-GCM'},true,['encrypt','decrypt'])}

/* ---- TOTP (RFC 6238, 30 秒, 6 位) ---- */
const B32='ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
function b32enc(bytes){let bits=0,val=0,out='';for(const b of bytes){val=((val<<8)|b)&0xffff;bits+=8;while(bits>=5){out+=B32[(val>>>(bits-5))&31];bits-=5}}if(bits>0)out+=B32[(val<<(5-bits))&31];return out}
function b32dec(s){s=String(s).toUpperCase().replace(/[^A-Z2-7]/g,'');let bits=0,val=0;const out=[];for(const c of s){val=((val<<5)|B32.indexOf(c))&0xffff;bits+=5;if(bits>=8){out.push((val>>>(bits-8))&255);bits-=8}}return new Uint8Array(out)}
async function hotp(secret,counter){const key=await crypto.subtle.importKey('raw',b32dec(secret),{name:'HMAC',hash:'SHA-1'},false,['sign']);
 const msg=new Uint8Array(8);let c=counter;for(let i=7;i>=0;i--){msg[i]=c&255;c=Math.floor(c/256)}
 const h=new Uint8Array(await crypto.subtle.sign('HMAC',key,msg));const o=h[h.length-1]&15;
 const code=(((h[o]&127)<<24)|(h[o+1]<<16)|(h[o+2]<<8)|h[o+3])%1000000;return String(code).padStart(6,'0')}
async function verifyTotp(secret,code){code=String(code||'').replace(/\D/g,'');if(code.length!==6||!secret)return false;const t=Math.floor(Date.now()/30000);for(const w of[-1,0,1])if(await hotp(secret,t+w)===code)return true;return false}
const ISSUER='童鞋貿易辦公室';
function deviceLabel(){const u=navigator.userAgent;if(/iPhone/.test(u))return 'iPhone';if(/iPad/.test(u)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1))return 'iPad';if(/Android/.test(u))return 'Android';if(/Mac/.test(u))return 'Mac電腦';if(/Windows/.test(u))return 'Windows電腦';return '電腦'}
const otpUri=(secret,label)=>`otpauth://totp/${encodeURIComponent(ISSUER+':'+label)}?secret=${secret}&issuer=${encodeURIComponent(ISSUER)}&algorithm=SHA1&digits=6&period=30`;
function qrSvg(text){const q=qrcode(0,'M');q.addData(text);q.make();return q.createSvgTag({cellSize:5,margin:4,scalable:true})}
function newRecoveryCode(){const b=rand(20);let s='';for(const x of b)s+=B32[x&31];return s.match(/.{4}/g).join('-')}
const normRC=s=>String(s||'').toUpperCase().replace(/[^A-Z2-7]/g,'');

/* ---- 價錢分離 ---- */
const PRICE_STYLE=['factoryPrice','sellPrice','sampleCost'];
const PRICE_DOC={CR:{f:['freight']},SD:{f:['reply.cost','reply.bulk','reply.mould']},QT:{l:['price']},CO:{l:['price'],f:['payments']},PO:{f:['cost']},PI:{l:['price'],f:['sayTotal']},INV:{l:['price'],f:['sayTotal']}};
function delPath(o,p){const ks=pathKeys(p);const last=ks.pop();const t=ks.reduce((a,k)=>a==null?a:a[k],o);if(t&&typeof t==='object')delete t[last]}
function splitData(s){(s.docs||[]).forEach(d=>(d.lines||[]).forEach(l=>{if(!l.lid)l.lid=uid()}));
 const G=JSON.parse(JSON.stringify(s));const P={styles:{},docs:{},auth:G.auth||{}};delete G.auth;
 (G.styles||[]).forEach(st=>{const o={};PRICE_STYLE.forEach(k=>{if(k in st){o[k]=st[k];delete st[k]}});if(Object.keys(o).length)P.styles[st.id]=o});
 (G.docs||[]).forEach(d=>{const R=PRICE_DOC[d.type];if(!R)return;const o={f:{},l:{}};
  (R.f||[]).forEach(p=>{const v=getPath(d,p);if(v!==undefined){o.f[p]=v;delPath(d,p)}});
  (R.l||[]).forEach(k=>(d.lines||[]).forEach(l=>{if(k in l){(o.l[l.lid]=o.l[l.lid]||{})[k]=l[k];delete l[k]}}));
  if(Object.keys(o.f).length||Object.keys(o.l).length)P.docs[d.id]=o});
 return{G,P}}
function mergeData(G,P){const s=JSON.parse(JSON.stringify(G));s.auth=(P&&P.auth)||{};P=P||{styles:{},docs:{}};
 (s.styles||[]).forEach(st=>Object.assign(st,P.styles?.[st.id]||{}));
 (s.docs||[]).forEach(d=>{const o=P.docs?.[d.id];if(!o)return;Object.entries(o.f||{}).forEach(([p,v])=>setPath(d,p,v));(d.lines||[]).forEach(l=>Object.assign(l,o.l?.[l.lid]||{}))});
 fillMissingPrices(s);return s}
// 同事開嘅單冇價錢：負責人登入時自動由報價 / 款式 / 訂單補返預設價
function fillMissingPrices(s){const st=n=>(s.styles||[]).find(x=>x.devNo===n)||{};const doc=id=>(s.docs||[]).find(x=>x.id===id);
 (s.docs||[]).forEach(d=>{
  if(d.type==='SD'){d.reply=d.reply||{};['cost','bulk','mould'].forEach(k=>{if(d.reply[k]===undefined)d.reply[k]=''})}
  if(d.type==='PO'&&d.cost===undefined)d.cost=st(d.devNo).factoryPrice??'';
  if(d.type==='CO'&&d.payments===undefined)d.payments=[];
  if((d.type==='PI'||d.type==='INV')&&d.sayTotal===undefined)d.sayTotal='';
  if(d.type==='CR'&&d.freight===undefined)d.freight='';
  (d.lines||[]).forEach(l=>{if(!['QT','CO','PI','INV'].includes(d.type)||l.price!==undefined)return;let p;
   if(d.type==='CO'){const q=doc(d.qtId);p=q?.lines.find(x=>x.devNo===l.devNo)?.price}
   if(d.type==='PI'||d.type==='INV'){const c=doc(d.coId);p=(c?.lines.find(x=>x.devNo===l.devNo&&x.color===l.color)||c?.lines.find(x=>x.devNo===l.devNo))?.price}
   l.price=p??st(l.devNo).sellPrice??''})})}

/* ---- 三方合併（以每張單 / 每個款式 / 每個客戶為單位） ---- */
const jeq=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
let MERGE_CONFLICTS=0;
function mVal(b,l,r){if(jeq(l,r))return l;if(jeq(l,b))return r;if(jeq(r,b))return l;if(l===undefined)return r;if(r===undefined)return l;MERGE_CONFLICTS++;return l}
function mById(b,l,r){b=b||[];l=l||[];r=r||[];const M=a=>Object.fromEntries(a.map(x=>[x.id,x]));const bm=M(b),lm=M(l),rm=M(r);
 const ids=[...r.map(x=>x.id),...l.map(x=>x.id).filter(id=>!(id in rm))];const out=[];
 [...new Set(ids)].forEach(id=>{const v=mVal(bm[id],lm[id],rm[id]);if(v!==undefined)out.push(v)});return out}
function mMap(b,l,r){b=b||{};l=l||{};r=r||{};const out={};new Set([...Object.keys(r),...Object.keys(l)]).forEach(k=>{const v=mVal(b[k],l[k],r[k]);if(v!==undefined)out[k]=v});return out}
const G_COLL=['customers','factories','styles','docs','suppliers'];
function mTop(b,l,r){b=b||{};const out={};new Set([...Object.keys(r||{}),...Object.keys(l||{})]).forEach(k=>{
 const v=G_COLL.includes(k)?mById(b[k],l[k],r[k]):mVal(b[k],l[k],r[k]);if(v!==undefined)out[k]=v});return out}
function mP(b,l,r){b=b||{};return{styles:mMap(b.styles,l.styles,r.styles),docs:mMap(b.docs,l.docs,r.docs),auth:mVal(b.auth,l.auth,r.auth)}}

// 將雲端版本同本機合併；回傳 {changed: 合併結果同雲端唔同（要上傳）, gotRemote: 有攞到其他人嘅改動}
async function ncMerge(remote){

  if(await keyRaw(rgk)!==await keyRaw(GK)){
   if(BASE&&BASE.users)throw Object.assign(new Error('foreign'),{code:'foreign'});
   GK=rgk;await ncSaveCreds()}}// 呢部機啱啱由舊版升級：跟返雲端（另一部機先升級）嘅一般資料鎖匙
 const Gr=await tryDec(GK,remote.gdata);if(!Gr)throw Object.assign(new Error('foreign'),{code:'foreign'});
 const baseOk=BASE&&BASE.users;const Gb=baseOk?await tryDec(GK,BASE.gdata):null;
 const{G:Gl,P:Pl}=splitData(S);MERGE_CONFLICTS=0;
 const Gm=mTop(Gb,Gl,Gr);let Pm=null,Pr=null;
 if(PK){Pr=await decData(PK,remote.pdata);const Pb=baseOk?await tryDec(PK,BASE.pdata):null;Pm=mP(Pb,Pl,Pr)}
 const Um=mById(baseOk?BASE.users:null,VAULT.users,remote.users);const rc=mVal(baseOk?BASE.rc:undefined,VAULT.rc,remote.rc);const label=mVal(baseOk?BASE.label:undefined,VAULT.label,remote.label);
 if(!Um.some(u=>u.id===ME.id)){await idbPut('vault',{...remote});VAULT=remote;S=null;GK=null;PK=null;ME=null;loginView('你嘅帳戶已經被負責人移除。');throw Object.assign(new Error('removed'),{code:'removed'})}
 const gotRemote=!jeq(Gm,Gl)||(PK&&!jeq(Pm,Pl));
 if(gotRemote){S=PK?mergeData(Gm,Pm):Gm;if(!PK)delete S.auth}
 const me=Um.find(u=>u.id===ME.id);ME.name=me.name;
 VAULT={...remote,users:Um,rc,label,gdata:await encData(GK,Gm),pdata:PK?await encData(PK,Pm):remote.pdata};await idbPut('vault',VAULT);
 const changed=!jeq(Gm,Gr)||(PK&&!jeq(Pm,Pr))||!jeq(Um,remote.users)||!jeq(rc,remote.rc);
 return{changed,gotRemote}}

   if(r.changed){NCST.dirty=true;pushAfter=true}else NCST.dirty=false;ncSaveState();
   if(r.gotRemote){ncRerender();toast(MERGE_CONFLICTS?`☁ 已同步（${MERGE_CONFLICTS} 項同時被改過，保留咗你呢邊嘅版本）`:'☁ 已同步其他人嘅更新')}}
 }catch(e){if(e.code==='removed')return;if(e.code==='foreign')ncForeign();else{NCST.err=ncErrMsg(e);ncSaveState()}}
 finally{ncBusy=false;paintSync()}
 if(pushAfter&&GK)ncPush(force)}
/* 推上雲端（如果雲端有新版本，先合併再推） */
async function ncPush(force){if(!NC||!GK)return;if(ncBusy){clearTimeout(ncPushTimer);ncPushTimer=setTimeout(()=>ncPush(force),2000);return}ncBusy=true;paintSync('busy');
 try{let rv=await ncGetJson(NC,'rev.json');
  if(rv&&rv.rev!==NCST.rev&&!force){const remote=await ncGetJson(NC,'vault.json');await flush();const r=await ncMerge(remote);NCST.rev=rv.rev;await setBase(remote);if(r.gotRemote)ncRerender()}
  if(!rv)await ncMkcol(NC);
  await flush();const rev=uid();const v={...VAULT,rev,pushedAt:new Date().toISOString()};
  await ncPut(NC,'vault.json',v);await ncPut(NC,'rev.json',{rev,savedAt:new Date().toISOString(),by:(ME?.name||'')+' · '+deviceLabel()});

 }catch(e){if(e.code==='removed')return;if(e.code==='foreign')ncForeign();else{NCST.err=ncErrMsg(e);ncSaveState()}}finally{ncBusy=false;paintSync()}}

 const Gr=await tryDec(GK,v.gdata);if(!Gr){ncForeign();return false}
 let s=Gr;if(PK){const P=await tryDec(PK,v.pdata);if(!P){ncForeign();return false}s=mergeData(Gr,P)}else delete s.auth;
 if(!v.users.some(u=>u.id===ME.id)){ncForeign();return false}
 S=s;VAULT=v;await idbPut('vault',v);await setBase(v);NCST.rev=v.rev;NCST.dirty=false;NCST.last=Date.now();NCST.err='';NCST.foreign=false;ncSaveState();ncRerender();toast('☁ 已載入雲端最新資料');return true}

/* =================== 備註附件（每個檔案獨立加密，Nextcloud 分開儲存）+ 影相認字 + 材料供應商 =================== */
const ATT_URL={};            // id → objectURL（已解密，只喺記憶體）
const MAX_FILE=25*1024*1024;
async function attEncrypt(bytes){const iv=rand(12);const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},GK,bytes));const out=new Uint8Array(12+ct.length);out.set(iv,0);out.set(ct,12);return out}
async function attDecrypt(blob){const u=new Uint8Array(blob);return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:u.slice(0,12)},GK,u.slice(12)))}
async function attQueue(id,add){let q=await idbGet('attq').catch(()=>null)||[];q=q.filter(x=>x!==id);if(add)q.push(id);await idbPut('attq',q)}
async function attStore(id,bytes){const enc=await attEncrypt(bytes);await idbPut('att:'+id,enc);await attQueue(id,true);ncAttUpload()}
// 攞返解密咗嘅內容：本機冇就由 Nextcloud 下載
async function attBytes(id){let enc=await idbGet('att:'+id).catch(()=>null);
 if(!enc&&NC){try{const r=await ncFetch(NC,'GET','att/'+id+'.bin');if(r.ok){enc=new Uint8Array(await r.arrayBuffer());await idbPut('att:'+id,enc)}}catch(e){}}
 if(!enc)return null;return attDecrypt(enc)}
async function attURL(f){if(ATT_URL[f.id])return ATT_URL[f.id];const b=await attBytes(f.id);if(!b)return null;return ATT_URL[f.id]=URL.createObjectURL(new Blob([b],{type:f.type||'application/octet-stream'}))}
let attUploading=false;
async function ncAttUpload(){if(!NC||!GK||attUploading)return;attUploading=true;
 try{const q=await idbGet('attq').catch(()=>null)||[];if(!q.length)return;
  const mk=await ncFetch(NC,'MKCOL','att');if(!(mk.ok||mk.status===405)&&mk.status!==409)throw new Error('HTTP '+mk.status);
  for(const id of q){const enc=await idbGet('att:'+id);if(!enc){await attQueue(id,false);continue}
   const r=await ncFetch(NC,'PUT','att/'+id+'.bin',enc,'application/octet-stream');if(!r.ok)throw new Error('HTTP '+r.status);await attQueue(id,false)}}
 catch(e){console.warn('附件上傳稍後再試',e)}finally{attUploading=false}}

/* ---- 加檔案 ---- */
function loadImg(file){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>res(im);im.onerror=()=>res(null);im.src=r.result};r.onerror=()=>res(null);r.readAsDataURL(file)})}
function imgTo(im,max,q){const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);return c}
const canvasBytes=(c,q)=>new Promise(res=>c.toBlob(b=>b.arrayBuffer().then(a=>res(new Uint8Array(a))),'image/jpeg',q));
async function makeAtt(file){const id=uid();const isImg=/^image\//.test(file.type)&&!/svg/.test(file.type);
 if(isImg){const im=await loadImg(file);if(im){const full=imgTo(im,1800,.82);const bytes=await canvasBytes(full,.82);const thumb=imgTo(im,320,.6).toDataURL('image/jpeg',.6);
   await attStore(id,bytes);return{id,name:(file.name||'photo').replace(/\.\w+$/,'')+'.jpg',type:'image/jpeg',size:bytes.length,img:true,thumb}}}
 if(file.size>MAX_FILE){toast(`「${file.name}」超過 25MB，冇加入`);return null}
 const bytes=new Uint8Array(await file.arrayBuffer());await attStore(id,bytes);return{id,name:file.name||'file',type:file.type||'application/octet-stream',size:bytes.length,img:false}}
function noteOf(docId,noteId){const d=docById(docId);return d&&(d.notes||[]).find(n=>n.id===noteId)}
function noteNew(docId){const d=docById(docId);d.notes=d.notes||[];d.notes.push({id:uid(),at:new Date().toISOString(),by:ME?.name||'',text:'',files:[],contact:null});save();render();

async function noteFiles(docId,noteId,input){const n=noteOf(docId,noteId);if(!n||!input.files.length)return;toast('處理緊檔案…');
 for(const f of input.files){const a=await makeAtt(f);if(a)n.files.push(a)}input.value='';save();render();toast(`已加入 ${n.files.length} 個檔案`)}
function noteDelFile(docId,noteId,fid){const n=noteOf(docId,noteId);ask('刪除呢個檔案？',()=>{n.files=n.files.filter(f=>f.id!==fid);save();render()})}
function noteDel(docId,noteId){const d=docById(docId);ask('刪除成條備註（連埋入面嘅相片 / 檔案）？',()=>{d.notes=d.notes.filter(n=>n.id!==noteId);save();render()})}
async function attOpen(docId,noteId,fid){const n=noteOf(docId,noteId);const f=n&&n.files.find(x=>x.id===fid);if(!f)return;
 const url=await attURL(f);if(!url)return toast('呢個檔案喺其他機，未同步到（請檢查 Nextcloud 連接）');
 if(f.img){const b=document.getElementById('modalBox');b.innerHTML=`<img src="${url}" style="max-width:100%;max-height:70vh;display:block;margin:0 auto 10px"><div class="bar" style="justify-content:flex-end;margin:0"><button onclick="attSave('${docId}','${noteId}','${fid}')">⬇ 下載</button><button class="pri" onclick="closeModal()">關閉</button></div>`;
  b.style.maxWidth='900px';document.getElementById('modal').style.display='flex'}else attSave(docId,noteId,fid)}
async function attSave(docId,noteId,fid){const f=noteOf(docId,noteId).files.find(x=>x.id===fid);const b=await attBytes(f.id);if(!b)return;const blob=new Blob([b],{type:f.type});
 const ios=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
 if(ios&&navigator.canShare){try{const file=new File([blob],f.name,{type:f.type});if(navigator.canShare({files:[file]})){navigator.share({files:[file]}).catch(()=>{});return}}catch(e){}}
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=f.name;document.body.appendChild(a);a.click();a.remove()}
const fsize=n=>n>1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB';
const contactRows=c=>[['公司','company'],['聯絡人','person'],['電話','phone'],['微信','wechat'],['電郵','email'],['地址','addr']].filter(([,k])=>c&&c[k]);

/* ---- 影相認字（Tesseract，喺部機度運行，唔經第三方） ---- */
let OCRW=null,OCRLANG=null;
function loadScript(src){return new Promise((res,rej)=>{if(window.Tesseract)return res();const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('載入認字工具失敗（要有網絡先可以第一次載入）'));document.head.appendChild(s)})}
async function ocrWorker(lang,progress){const base=new URL('ocr/',location.href).href;await loadScript(base+'tesseract.min.js');
 if(OCRW&&OCRLANG===lang)return OCRW;if(OCRW){await OCRW.terminate();OCRW=null}
 OCRW=await Tesseract.createWorker(lang.split('+'),1,{workerPath:base+'worker.min.js',corePath:base,langPath:base+'lang',logger:m=>progress&&progress(m)});OCRLANG=lang;return OCRW}
const cjkJoin=s=>s.replace(/([㐀-鿿＀-￯])[ \t]+(?=[㐀-鿿＀-￯])/g,'$1');
function parseContact(raw){const lines=cjkJoin(raw).split(/\n+/).map(l=>l.replace(/[|｜]/g,' ').replace(/\s{2,}/g,' ').trim()).filter(l=>l.length>1);const all=lines.join('\n');
 const after=l=>l.replace(/^.*?(?:[:：]|\s)\s*/,'').trim();
 // 電話
 const phones=[];const add=p=>{p=p.trim().replace(/[\s-]+$/,'');const d=p.replace(/\D/g,'');if(d.length>=7&&!phones.some(x=>x.replace(/\D/g,'')===d))phones.push(p)};
 (all.match(/(?:\+?86[\s-]?)?1[3-9]\d[\s-]?\d{4}[\s-]?\d{4}/g)||[]).forEach(add);
 (all.match(/(?:\+?86[\s-]?)?\(?0\d{2,3}\)?[\s-]?\d{7,8}/g)||[]).forEach(add);
 (all.match(/\+?852[\s-]?[2-9]\d{3}[\s-]?\d{4}/g)||[]).forEach(add);
 lines.forEach(l=>{if(/(電話|电话|手機|手机|Tel|TEL|Mob|Phone|座機|座机|热线|熱線)/i.test(l)){(l.match(/\+?[\d][\d\s()-]{6,}\d/g)||[]).forEach(add)}});
 const email=(all.match(/[\w.+-]+@[\w-]+(?:\.[\w-]+)+/)||[''])[0];
 const wl=lines.find(l=>/(微信|WeChat|wechat|VX|vx|V信)/.test(l));const wechat=wl?(wl.match(/(?:微信|WeChat|wechat|VX|vx|V信)\s*(?:號|号)?\s*[:：]?\s*([A-Za-z0-9_-]{5,})/)||[])[1]||'':'';
 // 公司
 const coRe=/(有限公司|股份|公司|厂|廠|实业|實業|集团|集團|贸易|貿易|皮革|材料|鞋材|五金|织带|織帶|纺织|紡織|辅料|輔料|商行|Co\.|Ltd|Limited|Company|Factory|Industrial|Trading|Leather|Textile)/i;
 let company=lines.filter(l=>coRe.test(l)&&!/(地址|Add)/i.test(l)).sort((a,b)=>(/(有限公司|Ltd|Limited)/i.test(b)?100:0)+b.length-((/(有限公司|Ltd|Limited)/i.test(a)?100:0)+a.length))[0]||'';
 company=company.replace(/^(公司名稱|公司名称|公司|名稱|名称|Company)\s*[:：]\s*/i,'');
 // 聯絡人
 let person='';const TITLE='(?:業務|业务|銷售|销售|采购|採購|技術|技术)?(?:經理|经理|總監|总监|主管|代表|專員|专员|主任|總|总)';
 for(const l of lines){if(coRe.test(l)&&!/(聯絡人|联系人|聯繫人)/.test(l))continue;let m;
  if((m=l.match(/(?:聯絡人|联系人|聯繫人|姓名)\s*[:：]?\s*([一-鿿]{2,4}?)(?=$|\s|[,，]|業務|业务|經理|经理|先生|小姐|電話|电话|手機|手机|Tel)/))){person=m[1];break}
  if((m=l.match(new RegExp('([一-鿿]{1,3})\\s*'+TITLE+'(?![一-鿿])')))){person=m[1]+(m[0].match(/(總|总)$/)?m[0].slice(-1):'');break}
  if((m=l.match(/([一-鿿])\s*(先生|小姐|女士)(?![一-鿿])/))){person=m[1]+m[2];break}
  if((m=l.match(/(?:Mr|Ms|Mrs|Miss)\.?\s+([A-Z][a-z]+(?:\s+[A-Z][a-z]+)?)/))){person=m[1];break}}
 if(!person){const nl=lines.find(l=>/^[一-鿿]{2,3}$/.test(l)&&!coRe.test(l));if(nl)person=nl}
 const al=lines.find(l=>/(地址|地址|Add|Address)/i.test(l))||lines.find(l=>/[一-鿿].*(路|號|号|街|區|区|鎮|镇|村|大道|工業園|工业园)/.test(l)&&!coRe.test(l)&&l.length>=8)||'';
 const addr=al.replace(/^(地址|Add(?:ress)?)\.?\s*[:：]?\s*/i,'');
 return{company:company.slice(0,80),person:person.slice(0,40),phone:phones.join(', '),wechat,email,addr:addr.slice(0,120),raw:lines.join('\n')}}
async function ocrStart(docId,noteId,input){const file=input.files[0];input.value='';if(!file)return;const n=noteOf(docId,noteId);
 const b=document.getElementById('modalBox');b.style.maxWidth='560px';const lang=localStorage.getItem('so-ocr')||'chi_sim+eng';
 b.innerHTML=`<h3 style="margin-top:0">🔍 影相認字</h3><div id="ocrst" class="muted">準備緊…（第一次用要下載認字工具，大約 6MB）</div><div style="background:#eee;height:6px;border-radius:3px;margin:8px 0"><div id="ocrbar" style="background:var(--navy);height:6px;width:0;border-radius:3px"></div></div>`;
 document.getElementById('modal').style.display='flex';
 try{const att=await makeAtt(file);const im=await loadImg(file);const c=imgTo(im,2000,.9);
  const w=await ocrWorker(lang,m=>{const st=document.getElementById('ocrst'),bar=document.getElementById('ocrbar');if(!st)return;
   st.textContent=m.status==='recognizing text'?'認緊字…':'載入認字工具…';if(bar&&typeof m.progress==='number')bar.style.width=Math.round(m.progress*100)+'%'});

  b.innerHTML=`<h3 style="margin-top:0">🔍 認字結果（請核對 / 修改）</h3>${att?`<img src="${att.thumb}" style="max-height:140px;display:block;margin:0 auto 8px;border:1px solid #ddd">`:''}
  <div class="form" style="grid-template-columns:1fr 1fr">${[['公司名','company'],['聯絡人','person'],['電話','phone'],['微信','wechat'],['電郵','email'],['地址','addr']].map(([l,k])=>`<div class="${k==='company'||k==='addr'?'wide':''}"><label>${l}</label><input id="ocr_${k}" value="${esc(r[k])}"></div>`).join('')}
  <div class="wide"><label>讀到嘅全部文字（會加入備註，可以改）</label><textarea id="ocr_raw" style="min-height:90px">${esc(r.raw)}</textarea></div></div>
  <label style="display:flex;gap:6px;align-items:center;margin:8px 0"><input type="checkbox" id="ocr_sup" style="width:auto" checked> 同時加入「材料供應商」名單（方便日後搵）</label>
  <div class="muted" style="margin-bottom:8px">認得唔準？試吓轉語言：<select id="ocr_lang" style="width:auto">${[['chi_sim+eng','簡體 + 英文（內地卡片）'],['chi_tra+eng','繁體 + 英文（香港 / 台灣）'],['eng','淨英文']].map(([v,l])=>`<option value="${v}" ${v===lang?'selected':''}>${l}</option>`).join('')}</select> 再重新影一次。</div>
  <div class="bar" style="justify-content:flex-end;margin:0"><button onclick="closeModal()">取消</button><button class="pri" id="ocr_ok">加入備註</button></div>`;
  document.getElementById('ocr_lang').onchange=e=>localStorage.setItem('so-ocr',e.target.value);
  document.getElementById('ocr_ok').onclick=()=>{const v=k=>document.getElementById('ocr_'+k).value.trim();const ct={company:v('company'),person:v('person'),phone:v('phone'),wechat:v('wechat'),email:v('email'),addr:v('addr')};
   if(att)n.files.push(att);n.contact=ct;const raw=v('raw');if(raw)n.text=((n.text||'').trim()?n.text.trim()+'\n\n':'')+raw;
   if(document.getElementById('ocr_sup').checked&&(ct.company||ct.phone))supplierUpsert(ct,att,docById(docId));closeModal();save();render();toast('已加入備註'+(document.getElementById('ocr_sup')?.checked?'同材料供應商':''))};
 }catch(e){console.error(e);b.innerHTML=`<h3 style="margin-top:0">🔍 影相認字</h3><p class="warn">${esc(e.message||'認字失敗')}</p><p class="muted">相片已經加入咗備註，你可以自己打字。</p><div class="bar" style="justify-content:flex-end;margin:0"><button class="pri" onclick="closeModal();render()">關閉</button></div>`;
  if(!n.files.some(f=>f.name===file.name)){const a=await makeAtt(file).catch(()=>null);if(a){n.files.push(a);save()}}}}

 ${F('付款帳號（到付 / 第三方）',inp(P+'.acct',{ph:'例如客人 DHL 帳號'}))}${own?F('運費（我哋成本）',inp(P+'.freight',{n:1})):''}</div></div>
 <div class="card"><h3>收件人</h3><div class="form">${F('寄俾',sel(P+'.toType',[['cust','客戶'],['fac','工廠'],['other','其他（自己填）']],{r:1}))}
 ${D.toType==='cust'?F('客戶',sel(P+'.cust',custOpts(),{r:1})):D.toType==='fac'?F('工廠',sel(P+'.fac',facOpts(),{r:1})):''}
 ${F('公司',inp(R+'.company'),'w2')}${F('收件人 Attn',inp(R+'.attn'))}${F('電話',inp(R+'.tel'))}${F('電郵',inp(R+'.email'))}${F('國家',inp(R+'.country'))}${F('地址',ta(R+'.addr',50),'wide')}</div>
 <p class="muted">揀客戶 / 工廠會自動帶入地址電話，之後可以改。</p></div>
 <div class="card"><h3>相關樣板單</h3><div class="bar">${(D.sdIds||[]).map((id,k)=>{const s=docById(id);return s?`<span class="chip on sel">${link(s,s.no+' '+(s.devNo||''))}<i onclick="D.sdIds.splice(${k},1);save();render()">✕</i></span>`:''}).join('')||'<span class="muted">未有</span>'}
 <select style="width:auto;background:#fff;color:#1f3864;border-color:#1f3864" onchange="if(this.value&&!D.sdIds.includes(this.value)){D.sdIds.push(this.value);const s=docById(this.value);if(s&&s.devNo&&!D.lines.some(l=>l.devNo===s.devNo))D.lines.push(crLineFromStyle(s.devNo,parseInt(String(s.qty||'').replace(/\\D/g,''))||1));save();render()}"><option value="">＋ 加樣板單</option>${sds.map(s=>`<option value="${s.id}">${esc(s.no)} ${esc(s.devNo||'')} ${esc(findCust(s.cust).name||'')}</option>`).join('')}</select></div></div>
 <div class="card"><h3>快遞 Invoice 內容（報關用）</h3><div class="form">${F('單據標題',sel(P+'.title',['PROFORMA INVOICE','COMMERCIAL INVOICE']))}${F('出口原因 Reason for Export',sel(P+'.reason',CR_REASONS))}${F('貿易條款',sel(P+'.incoterm',['DAP','DDP','EXW','FOB','CIF']))}${F('貨幣',inp(P+'.currency'))}</div>
 <div class="scroll" style="margin-top:10px"><table class="grid"><tr><th>#</th><th>貨品描述 Description</th><th>款號</th><th>HS Code</th><th>數量</th><th>單位</th><th>申報單價</th><th>金額</th><th>原產地</th><th></th></tr>
 ${D.lines.map((l,i)=>`<tr><td class="c">${i+1}</td><td>${inp(`${P}.lines.${i}.desc`,{w:300})}</td><td>${sel(`${P}.lines.${i}.devNo`,styleOpts('—'),{w:130})}</td><td>${inp(`${P}.lines.${i}.hs`,{w:85})}</td><td>${inp(`${P}.lines.${i}.qty`,{n:1,w:60})}</td><td>${sel(`${P}.lines.${i}.unit`,['PRS','PCS','SET','KG','DOC'],{w:70})}</td><td>${inp(`${P}.lines.${i}.value`,{n:1,w:75})}</td><td class="c">${calc('cv'+i,()=>{const x=D.lines[i];return x?f2(num(x.qty)*num(x.value)):''})}</td><td>${inp(`${P}.lines.${i}.origin`,{w:70})}</td><td><button class="sm del" onclick="D.lines.splice(${i},1);save();render()">✕</button></td></tr>`).join('')}
 <tr class="tot"><td colspan="4" style="text-align:right">TOTAL</td><td class="c">${calc('cq',()=>f0(crQty(D)))}</td><td></td><td class="c">${esc(D.currency||'')}</td><td class="c">${calc('ct',()=>f2(crTotal(D)))}</td><td colspan="2"></td></tr></table></div>
 <div class="bar" style="margin:8px 0 0"><select style="width:auto;background:#fff;color:#1f3864;border-color:#1f3864" onchange="if(this.value){D.lines.push(crLineFromStyle(this.value,1));save();render()}">${styleOpts('＋ 加款式樣板').map(([a,b])=>`<option value="${esc(a)}">${esc(b)}</option>`).join('')}</select>
 <button class="sm" onclick="D.lines.push({devNo:'',desc:'',hs:'',qty:1,unit:'PCS',value:'',origin:S.company.origin||'China'});save();render()">＋ 加其他貨品</button>
 <span class="muted">申報價值係報關用嘅價值（樣板通常申報細額），唔係報俾客人嘅價錢。</span></div>
 <div class="form" style="margin-top:10px">${F('Invoice 備註',inp(P+'.remark',{ph:'例如 For evaluation only, not for resale.'}),'wide')}</div></div>
 ${notesCard(P)}`}

function crPrint(d){const c=S.company,r=d.recv||{},tot=crTotal(d),se=crSender(d);
 return `<div class="title">${esc(d.title||'PROFORMA INVOICE')}</div>
 <div class="two"><div><b>Shipper / Exporter:</b><br><b>${esc(c.en)}</b><br>${esc(se.addr||'')}${se.tel?'<br>Tel: '+esc(se.tel):''}${se.contact?'<br>Contact: '+esc(se.contact):''}${se.email?'<br>Email: '+esc(se.email):''}</div>
 <div><b>Consignee / Receiver:</b><br><b>${esc(r.company||'')}</b><br>${esc(r.addr||'').replace(/\n/g,'<br>')}${r.country?'<br>'+esc(r.country):''}${r.attn?'<br>Attn: '+esc(r.attn):''}${r.tel?'<br>Tel: '+esc(r.tel):''}${r.email?'<br>Email: '+esc(r.email):''}</div></div>
 <table class="t"><tr><td class="lb">Invoice No.</td><td>${esc(d.no)}</td><td class="lb">Date</td><td>${esc(d.date)}</td></tr>
 <tr><td class="lb">Courier</td><td>${esc(d.courier)}</td><td class="lb">AWB / Tracking No.</td><td>${esc(d.awb||'')}</td></tr>
 <tr><td class="lb">Reason for Export</td><td>${esc(d.reason)}</td><td class="lb">Terms of Delivery</td><td>${esc(d.incoterm||'')}</td></tr>
 <tr><td class="lb">No. of Packages</td><td>${esc(d.pkgs||'')}</td><td class="lb">Total Gross Weight</td><td>${d.weight?esc(d.weight)+' kg':''}</td></tr>
 <tr><td class="lb">Dimensions</td><td>${esc(d.dims||'')}${d.dims?' cm':''}</td><td class="lb">Country of Origin</td><td>${esc(c.origin||'')}</td></tr></table>
 <table class="t"><tr><th>No.</th><th>Full Description of Goods</th><th>HS Code</th><th>Qty</th><th>Unit</th><th>Unit Value</th><th>Total Value (${esc(d.currency||'')})</th><th>Origin</th></tr>
 ${d.lines.map((l,i)=>`<tr><td class="c">${i+1}</td><td>${esc(l.desc)}</td><td class="c">${esc(l.hs)}</td><td class="c">${f0(l.qty)}</td><td class="c">${esc(l.unit)}</td><td class="r">${f2(l.value)}</td><td class="r">${f2(num(l.qty)*num(l.value))}</td><td class="c">${esc(l.origin||'')}</td></tr>`).join('')}
 <tr class="tot"><td colspan="3" style="text-align:right">TOTAL</td><td class="c">${f0(crQty(d))}</td><td></td><td></td><td class="r">${esc(d.currency||'')} ${f2(tot)}</td><td></td></tr></table>
 ${/no commercial/i.test(d.reason)?'<p style="font-size:10px"><b>Samples of no commercial value, for evaluation purpose only. Not for resale.</b> Value declared for customs purpose only.</p>':''}
 ${d.remark?`<p style="font-size:10px">${esc(d.remark)}</p>`:''}
 <p style="font-size:10px">I hereby certify that the information on this invoice is true and correct and the contents of this shipment are as stated above.</p>
 ${sign(['',''],[`<b>Signature of Shipper</b><br><span style="font-size:9px">${esc(c.en)}${se.contact?' · '+esc(se.contact):''}</span>`,'Name / Signature / Date'])}${notesPrint(d)}`}

function crLogExtra(){const list=docsOf('CR');const moving=list.filter(d=>['已寄出','運送中'].includes(d.status)).length;
 return `<div class="bar" style="margin-top:-6px"><span class="muted">運送中：<b>${moving}</b> 件</span><span class="sp"></span><button class="sm" onclick="crCSV()">⬇ 匯出快遞紀錄 CSV</button></div>`}
function crCSV(){const rows=[['記錄號','寄出日期','寄件地點','快遞公司','運單號','收件公司','收件人','國家','內容','件數','重量kg','狀態','簽收日期','相關樣板單',...(CANP()?['運費']:[])]];
 docsOf('CR').forEach(d=>rows.push([d.no,d.date,crSender(d).name||'',d.courier,d.awb,d.recv?.company,d.recv?.attn,d.recv?.country,d.contents,d.pkgs,d.weight,d.status,d.delivered,(d.sdIds||[]).map(id=>docById(id)?.no||'').join(' '),...(CANP()?[d.freight??'']:[])]));
 download(`寄快遞紀錄-${today()}.csv`,'﻿'+rows.map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\r\n'),'text/csv')}

boot();
</script>
</body>
